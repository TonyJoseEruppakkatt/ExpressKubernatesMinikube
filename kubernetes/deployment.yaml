
apiVersion: apps/v1
kind: Deployment

metadata:
  name: express-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: express-app

  template:
    metadata:
      labels:
        app: express-app

    spec:
      containers:
        - name: express-container
          image: express-k8s:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
